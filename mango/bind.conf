# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,$mod,shift,none
var=mod,SUPER

# reload config
# bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=$mod,Return,spawn,ghostty

# noctalia
bind=$mod,space,                  spawn, noctalia msg panel-toggle launcher
bind=NONE,XF86AudioRaiseVolume,  spawn, noctalia msg volume-up 5
bind=NONE,XF86AudioLowerVolume,  spawn, noctalia msg volume-down 5
bind=NONE,XF86MonBrightnessUp,   spawn, noctalia msg brightness-up current 5
bind=NONE,XF86MonBrightnessDown, spawn, noctalia msg brightness-down current 5
bind=SUPER+SHIFT,S,              spawn, noctalia msg screenshot-region
bind=SUPER,B,                    spawn, noctalia msg panel-toggle session
bind=SUPER,V,                    spawn, noctalia msg panel-toggle clipboard
# bind=SUPER,R,                    spawn, $HOME/.config/mango/restart-noctalia.sh

#bind=SUPER+SHIFT,X,               spawn, hyprpicker -a
bind=$mod+SHIFT,X,               spawn, noctalia msg plugin oldirtty/color_picker:service all pick

# exit
bind=SUPER,m,quit
bind=$mod,q,killclient,

# switch window focus
# bind=SUPER,Tab,focusstack,next
bind=$mod,Left,focusdir,left
bind=$mod,Right,focusdir,right
bind=$mod,Up,focusdir,up
bind=$mod,Down,focusdir,down

# swap window
bind=$mod+SHIFT,Up,exchange_client,up
bind=$mod+SHIFT,Down,exchange_client,down
bind=$mod+SHIFT,Left,exchange_client,left
bind=$mod+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=$mod,Tab,togglejump,
bind=$mod,backslash,togglefloating,
bind=$mod,a,togglemaximizescreen,
bind=$mod,f,togglefullscreen,
bind=$mod+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=$mod,z,toggle_scratchpad

# # scroller layout
# bind=$mod,e,set_proportion,1.0
# bind=$mod,x,switch_proportion_preset,
# bind=$mod+super+ctrl,Left,scroller_stack,left
# bind=$mod+super+ctrl,Right,scroller_stack,right
# bind=$mod+super+ctrl,Up,scroller_stack,up
# bind=$mod+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=$mod+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
#bind=SUPER,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
#bind=SUPER,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,Left,tagtoleft,0
#bind=CTRL+SUPER,Right,tagtoright,0

# two finger
gesturebind=none,left,3,focusstack,next
gesturebind=none,right,3,focusstack,prev
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client

bind=$mod,1,view,1,0
bind=$mod,2,view,2,0
bind=$mod,3,view,3,0
bind=$mod,4,view,4,0
bind=$mod,5,view,5,0
bind=$mod,6,view,6,0
bind=$mod,7,view,7,0
bind=$mod,8,view,8,0
bind=$mod,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=$mod,1,tagsilent,1
bind=$mod+SHIFT,1,tag,1,0
bind=$mod+SHIFT,2,tag,2,0
bind=$mod+SHIFT,3,tag,3,0
bind=$mod+SHIFT,4,tag,4,0
bind=$mod+SHIFT,5,tag,5,0
bind=$mod+SHIFT,6,tag,6,0
bind=$mod+SHIFT,7,tag,7,0
bind=$mod+SHIFT,8,tag,8,0
bind=$mod+SHIFT,9,tag,9,0

# monitor switch
#bind=SUPER,Left,focusmon,left
#bind=SUPER,Right,focusmon,right
#bind=SUPER+SHIFT,Left,tagmon,left
#bind=SUPER+SHIFT,Right,tagmon,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resize win
bind=$mod+CTRL,Up,resizewin,+0,-50
bind=$mod+CTRL,Down,resizewin,+0,+50
bind=$mod+CTRL,Left,resizewin,-50,+0
bind=$mod+CTRL,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
